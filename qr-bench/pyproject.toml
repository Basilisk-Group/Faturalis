[project]
name = "qr-bench"
version = "0.1.0"
description = "Measures how reliably Portuguese fiscal QR codes can be extracted from invoice/receipt images"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "pyzbar>=0.1.9",
    "opencv-python-headless>=4.10",
    "pymupdf>=1.24",
    "pillow>=10.4",
    "qrcode>=7.4",
    "numpy>=1.26",
    "openpyxl>=3.1.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qr_bench"]
